name: Build & Release MediaVault APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Без явной версии — берём последнюю stable.
      # Если нужна конкретная — раскомментируй flutter-version.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # flutter-version: '3.35.4'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   release_apks/MediaVault-1.0.0-arm64-v8a.apk   || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/MediaVault-1.0.0-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release_apks/MediaVault-1.0.0-x86_64.apk      || true
          # fallback: если split не сработал — копируем единый APK
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "split OK"
          else
            cp build/app/outputs/flutter-apk/app-release.apk release_apks/MediaVault-1.0.0-universal.apk
          fi
          ls -la release_apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-apks
          path: release_apks/*.apk
          retention-days: 30

      - name: Create GitHub Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          generate_release_notes: true
          name: MediaVault ${{ github.ref_name }}
