name: Build MediaVault APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      # Никакого rm -rf и flutter create — используем папку android из репозитория
      - run: flutter pub get

      - run: flutter analyze

      - run: flutter clean

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediavault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
