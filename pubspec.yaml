publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.17.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4
  encrypt: ^5.0.3
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  image_picker: ^1.0.7
  flutter_windowmanager_plus: ^1.1.1
