name: mediavault
description: "Encrypted local media vault."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Дизайн (Liquid Glass)
  liquid_glass_widgets: ^1.16.1

  # Биометрия и безопасное хранение ключей
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0

  # Зашифрованная база данных
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.0

  # Работа с медиа
  photo_manager: ^3.8.0

  # Блокировка скриншотов
  flutter_windowmanager_plus: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
