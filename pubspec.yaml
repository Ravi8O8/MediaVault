name: mediavault
description: "Encrypted local media vault. Supports 150GB+ with streaming I/O."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.17.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  image_picker: ^1.0.7
  flutter_windowmanager_plus: ^1.1.1
  video_player: ^2.8.2
  share_plus: ^10.1.4
  image: ^4.2.0
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  # Замена video_thumbnail на форк с поддержкой Gradle 9 / AGP 9
  ym_video_thumbnail: ^1.0.0
  flutter_image_compress: ^2.3.0
  archive: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0F2027"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
